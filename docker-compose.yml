# Hạ tầng cục bộ (Kế hoạch mục 5, review R-25, R-27): PostgreSQL, Hive Metastore, Spark Thrift Server, Airflow 3.
# Delta nằm trên ./data/lake (bind mount, /lake trong container); dữ liệu nguồn ở ./data/raw (chỉ đọc).
# Khởi động: make up   (cần file .env, sao chép từ .env.example)

x-airflow: &airflow
  image: mortgage-datavault-airflow-scheduler:latest
  build: docker/airflow
  user: "${AIRFLOW_UID:-1000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    PYTHONPATH: /opt/project
    SPARK_CONF_DIR: /opt/project/docker/spark/conf
    ANALYTICS_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/analytics
    DBT_PROFILES_DIR: /opt/project/dbt
  volumes:
    - .:/opt/project
    - ${RAW_DATA_DIR:-./data/raw}:/data/raw:ro
    - ${LAKE_DATA_DIR:-./data/lake}:/lake
    - ${PIPELINE_CONFIG_FILE:-./conf/pipeline.yml}:/opt/project/conf/pipeline.yml:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres: { condition: service_healthy }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "analytics"]
      interval: 5s
      retries: 20

  # disallow.incompatible.col.type.changes=false: Delta ghi schema bảng vào metastore sau mỗi lần ghi; metastore 3.1
  # mặc định từ chối và Delta in stack trace (không làm hỏng dữ liệu, nhưng che mất lỗi thật trong log)
  hive-metastore:
    image: mortgage-datavault-hive-metastore:latest
    build: docker/hive
    environment:
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD}
        -Dhive.metastore.warehouse.dir=/lake/warehouse
        -Dfs.permissions.umask-mode=002
        -Dhive.metastore.disallow.incompatible.col.type.changes=false
    volumes:
      - ${LAKE_DATA_DIR:-./data/lake}:/lake
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/9083"]
      interval: 5s
      retries: 30
    mem_limit: 1g

  spark-thrift:
    image: mortgage-datavault-spark-thrift:latest
    build: docker/spark
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_CONF_DIR: /opt/spark/conf-lakehouse
    command:
      - /opt/spark/sbin/start-thriftserver.sh
      - --master=local[4]
      # Heap 2,5 GiB trong container 4 GiB: chừa 1,5 GiB cho bộ nhớ ngoài heap (metaspace, direct buffer, Parquet).
      # Heap 3 GiB bị OOM-kill sau khoảng 19 phút chạy cổng C1 trên clone sạch (R-39, SP-09)
      - --driver-memory=2560m
    volumes:
      - ./docker/spark/conf:/opt/spark/conf-lakehouse:ro
      - ${LAKE_DATA_DIR:-./data/lake}:/lake
    depends_on:
      hive-metastore: { condition: service_healthy }
    ports: ["127.0.0.1:${THRIFT_PORT:-10000}:10000", "127.0.0.1:${SPARK_UI_PORT:-4040}:4040"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/10000"]
      interval: 5s
      retries: 40
    mem_limit: 4g
    # Bị kill thì tự lên lại; tầng dbt đang chạy được job theo tầng thử lại có giới hạn (PL-05, R-39)
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports: ["127.0.0.1:${AIRFLOW_PORT:-8080}:8080"]
    depends_on:
      <<: *airflow-depends
      airflow-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      retries: 20
    mem_limit: 1g

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor
    depends_on:
      <<: *airflow-depends
      airflow-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 15s
      retries: 20
    mem_limit: 768m

  # LocalExecutor: task (kể cả job Spark local mode) chạy trong container này
  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init: { condition: service_completed_successfully }
      hive-metastore: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 15s
      retries: 20
    mem_limit: 5g

volumes:
  pgdata:
  airflow-logs:
