[project]
name = "mortgage-datavault"
version = "0.1.0"
description = "Lakehouse + Data Vault 2.0 trên Spark cho dữ liệu khoản vay Freddie Mac"
requires-python = ">=3.11,<3.12"
dependencies = [
    "psycopg2-binary>=2.9",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "defusedxml>=0.7.1",
    "deltalake>=1.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=18",
    "pytest>=8",
    "python-pptx>=1.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
