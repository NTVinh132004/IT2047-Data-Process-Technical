      satellite: sat_loan_origination
      rule: ngoai_mien
      column_name: credit_score
      value: '200'
    - LOAN_HK: Q2
      satellite: sat_loan_property
      rule: ngoai_mien
      column_name: occupancy_status
      value: X
    - LOAN_HK: Q5
      satellite: sat_loan_delinquency
      rule: ngoai_mien
      column_name: delinquency_status
      value: ZZ
    - LOAN_HK: Q6
      satellite: sat_loan_balance
      rule: ngoai_mien
      column_name: current_upb
      value: null
    - LOAN_HK: Q7
      satellite: xts_loan
      rule: mo_coi
      column_name: loan_id
      value: null
