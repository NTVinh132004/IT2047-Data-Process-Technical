# Test Raw Vault (FR-22): khóa duy nhất, không null, quan hệ tới Hub (bỏ qua ghost record), cột kiểm toán không null.
version: 2
models:
- name: hub_loan
  columns:
  - name: LOAN_HK
    data_tests:
    - unique
    - not_null
