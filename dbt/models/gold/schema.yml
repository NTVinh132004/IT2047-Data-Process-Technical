    data_tests:
    - unique
    - not_null
- name: dim_date
  columns:
  - name: reporting_date
    data_tests:
    - unique
    - not_null
- name: dim_geography
  columns:
  - name: geography_key
    data_tests:
    - unique
    - not_null
- name: fact_loan_month
  columns:
