name: mortgage_datavault
version: "1.0.0"
profile: lakehouse
model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Quy tắc hash chốt ở PRD FR-06 (sha2-256, upper, trim, null thành ^^, nối bằng ||); không đổi sau khi đã nạp
  hash: SHA
  concat_string: "||"
  null_placeholder_string: "^^"
  hash_content_casing: UPPER
  # Ghost record ở mọi Satellite (zero key, load_date 1900-01-01) để PIT trỏ tới thay vì null: mọi join là equi-join (R-33)
  enable_ghost_records: true
  system_record_value: SYSTEM
  # Các kỳ của lần nạp (--vars '{periods: [2020Q1, 2020Q2]}'); job Raw Vault gom nhiều kỳ liền nhau vào một lần nạp
  # (R-34). Để trống thì staging lấy mọi kỳ (dựng lại toàn bộ)
  periods: []
  # Bật một test cố ý sai để kiểm DAG dừng khi dbt test lỗi (FR-22, cổng C2)
  inject_test_failure: false

models:
  mortgage_datavault:
    +file_format: delta
    staging:
      +schema: staging
      +materialized: view
      # stg_*: bảng ghi lại mỗi lần chạy, không phải view. Spark chép nguyên cây biểu thức của view ở mỗi chỗ tham chiếu;
      # macro sat incremental tham chiếu stage 5 lần, nên lập kế hoạch mất hơn 60 giây và làm tràn heap Thrift (R-30).
      # Lưu thành bảng còn giúp hash chỉ tính một lần cho cả 10 model Raw Vault.
      stg_orig:
        +materialized: table
      stg_perf:
        +materialized: table
    raw_vault:
      +schema: raw_vault
      +materialized: incremental
      # Chạy lại kỳ cũ không chèn lại dòng: chỉ nhận dòng mới hơn phiên bản mới nhất (R-08, R-26)
      +meta:
        apply_source_filter: true
    business_vault:
      +schema: business_vault
      +materialized: incremental
    baseline:
      # Star schema ghi đè (SCD1), chỉ để đối chứng với Data Vault trong đợt sửa dữ liệu (FR-14, AC-09)
      +schema: baseline

seeds:
  mortgage_datavault:
    +schema: staging
