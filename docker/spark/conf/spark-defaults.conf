# Cấu hình Spark dùng chung cho Thrift Server và job PySpark trong Airflow (SPARK_CONF_DIR).
spark.sql.extensions                 io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog      org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.catalogImplementation      hive
spark.sql.warehouse.dir              /lake/warehouse
spark.sql.shuffle.partitions         16
spark.sql.session.timeZone           UTC
spark.ui.showConsoleProgress         false
# Delta: cho phép replaceWhere ghi đè đúng lát của kỳ (FR-04, FR-07)
spark.databricks.delta.replaceWhere.dataColumns.enabled  true
# Job PySpark trong container airflow-scheduler (mem_limit 5g); Thrift Server đặt riêng bằng --driver-memory
spark.driver.memory                  3g
# Mọi container chạy uid 1000; thư mục tạo ra cho phép cả nhóm ghi
spark.hadoop.fs.permissions.umask-mode  002
# Thrift Server chạy lâu phục vụ dbt: Spark UI mặc định giữ lịch sử 1000 truy vấn kèm plan và làm tràn heap
# sau vài nghìn truy vấn (OOM ngày 30/10/2026, review R-29). Giữ ít lịch sử hơn.
spark.sql.ui.retainedExecutions      50
spark.ui.retainedJobs                100
spark.ui.retainedStages              100
spark.ui.retainedTasks               10000
spark.sql.thriftServer.ui.retainedSessions    20
spark.sql.thriftServer.ui.retainedStatements  50
