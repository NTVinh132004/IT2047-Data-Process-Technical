# Spike C0: dbt-spark + automate-dv qua Spark Thrift Server, Delta trên ổ đĩa cục bộ.
# Chưa có MinIO và Hive Metastore riêng (metastore Derby nhúng); những phần đó thuộc C1.
services:
  thrift:
    build: { context: ., dockerfile: Dockerfile.thrift }
    user: root
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command:
      - /opt/spark/sbin/start-thriftserver.sh
      - --master=local[4]
      - --driver-memory=3g
      - --conf=spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      - --conf=spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - --conf=spark.sql.warehouse.dir=/warehouse/spark-warehouse
      - --conf=spark.sql.shuffle.partitions=8
      - --driver-java-options=-Dderby.system.home=/warehouse
    volumes:
      - ../../data/raw/sample_2019:/data:ro
      - warehouse:/warehouse

  dbt:
    build: .
    depends_on: [thrift]
    working_dir: /spike/dbt
    environment:
      DBT_PROFILES_DIR: /spike/dbt
    volumes:
      - .:/spike
    entrypoint: ["sleep", "infinity"]

volumes:
  warehouse:
